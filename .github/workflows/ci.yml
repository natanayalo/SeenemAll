name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  lint:
    name: "🧹 Pre-commit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', '.pre-commit-config.yaml') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-precommit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: ${{ runner.os }}-precommit-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files
  tests:
    name: "🧪 Pytest"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest
  openvino:
    name: "⚡ OpenVINO compatibility"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenVINO dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-openvino.txt
      - name: Verify OpenVINO model classes
        run: |
          python -c "from optimum.intel.openvino import OVModelForFeatureExtraction, OVModelForSequenceClassification; print('OpenVINO imports OK')"
  frontend:
    name: "🌐 Frontend"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
  security:
    name: "🔒 Dependency audit"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.txt
          # CVE-2026-9856 / PYSEC-2026-3929 requires an attacker-controlled chat template followed
          # by save_pretrained(). api/core/model_security.py validates the path
          # using the upstream fix before either application save call.
          # PYSEC-2026-4174 (GHSA-x9r9-c232-4q39) affects GenerativePreTrainedModel.load_custom_generate()
          # in transformers <= 5.8.1; SeenemAll uses embedding and classification models only.
          pip-audit -r requirements-openvino.txt --ignore-vuln PYSEC-2026-3929 --ignore-vuln PYSEC-2026-4174
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm run audit
