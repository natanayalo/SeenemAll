[pytest]
addopts = --cov=api --cov=etl --cov=evaluation --cov-report=term-missing --cov-report=json:.cache/coverage.json --cov-fail-under=85
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    enable_trending_helper: allow trending prior helper during unit tests
